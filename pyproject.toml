[project]
name = "proposals-api"
version = "0.1.0"
description = "Margin Copilot proposals API: pending drafts, approval rules (D-012), Table Storage. No LLM."
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.5",
  "azure-data-tables==12.7.0",
  "azure-identity==1.27.0",
  "margin-copilot-shared",
  "mssql-python==1.17.0",
  "pydantic==2.14.3",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[tool.uv.sources]
margin-copilot-shared = { git = "https://github.com/margin-copilot/shared", tag = "v0.4.0" }

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
