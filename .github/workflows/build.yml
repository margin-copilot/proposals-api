name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: proposals-api:smoke
      - name: The SQL driver loads in the image
        run: |
          docker run --rm --entrypoint python proposals-api:smoke -c "
          import mssql_python
          try:
              mssql_python.connect('Server=tcp:127.0.0.1,1;Database=x;Encrypt=yes', timeout=3)
          except Exception as error:
              text = str(error)
              assert 'open lib' not in text and 'shared object' not in text, text
              print('driver loads; refused as expected:', type(error).__name__)
          "
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ secrets.CONTAINER_APP_NAME }}
      RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
    steps:
      - id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # v2 has no v2.x.y tags; the commit is the v2 tag's
      - uses: Azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          imageToDeploy: ${{ steps.tag.outputs.image }}
          containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          disableTelemetry: true
      - name: Wait until the new revision serves all traffic
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          deadline=$((SECONDS + 300))
          while :; do
            # the revision's trafficWeight follows the traffic setting, not the routing:
            # a revision that never passes its readiness probe also shows 100, so
            # readiness is read from the app's latest ready revision
            read -r rev ready < <(az containerapp show -n "$APP" -g "$RG" \
              --query "{l:properties.latestRevisionName, r:properties.latestReadyRevisionName}" -o tsv)
            # trafficWeight last: an empty value would shift the fields after it
            read -r state running image weight < <(az containerapp revision show -n "$APP" -g "$RG" --revision "$rev" \
              --query "{s:properties.provisioningState, r:properties.runningState, i:properties.template.containers[0].image, w:properties.trafficWeight}" -o tsv)
            echo "$rev: $state, $running, ${weight:-0}% of traffic, ready: $([ "$ready" = "$rev" ] && echo yes || echo no)"
            if [ "$image" = "$IMAGE" ] && [ "$ready" = "$rev" ] && [ "$state" = Provisioned ] && [ "${weight:-0}" = 100 ]; then exit 0; fi
            if [ "$state" = Failed ] || [ "$running" = Failed ] || [ "$running" = ActivationFailed ]; then
              echo "::error::revision $rev failed: $state, $running"; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::no new revision serving after 5 minutes"; exit 1; fi
            sleep 10
          done
      - name: Smoke without a user token
        run: |
          fqdn=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "::add-mask::$fqdn"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 --retry 3 "https://$fqdn/proposals")
          echo "GET /proposals without a token: $code"
          test "$code" = 401
